name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── 1. Unit tests (no database, no secrets needed) ──────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 2. TypeScript type-check ─────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  # ── 3. RLS / security checks (needs Supabase secrets) ───────────────────
  #
  # SAFE APPROACH: verify-rls.ts signs in as existing seed users with the
  # ANON key (RLS enforced) and reads existing seed data. It does NOT create
  # new rows except:
  #   - One RPC call (update_own_avatar) that is immediately cleaned up
  #   - One storage upload attempt that is EXPECTED TO FAIL (proving RLS blocks it)
  # Nothing is left behind in the production database.
  #
  # Requires these GitHub Actions secrets (repo → Settings → Secrets):
  #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
  #   SEED_OWNER_PASSWORD, SEED_CLIENT_PASSWORD, SEED_SETTER_PASSWORD
  rls-checks:
    name: RLS security checks
    runs-on: ubuntu-latest
    # Skip this job if secrets are not configured (e.g., forks without secrets)
    if: ${{ vars.RLS_CHECKS_ENABLED == 'true' || github.repository_owner == 'chrismilton157-ops' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RLS verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Email addresses are fixed by the seed script — not secret
          SEED_OWNER_EMAIL: owner@sunline.test
          SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
          SEED_CLIENT_EMAIL: client@brightroof.test
          SEED_CLIENT_PASSWORD: ${{ secrets.SEED_CLIENT_PASSWORD }}
          SEED_SETTER_EMAIL: setter@sunline.test
          SEED_SETTER_PASSWORD: ${{ secrets.SEED_SETTER_PASSWORD }}
        run: npm run verify:rls
